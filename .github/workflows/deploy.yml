name: Continuous Automated Deployment

on:
  push:
    branches:
      - phase-2
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy onto Linux server'
        required: true
        default: 'phase-2'
        type: choice
        options:
          - phase-2
          - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GCP Linux Server
    runs-on: self-hosted

    steps:
      - name: Selective Zero-Downtime Deployment
        shell: bash
        run: |
          TARGET_BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          echo "=========================================================="
          echo "Triggering deployment for branch: $TARGET_BRANCH"
          echo "Commit: ${{ github.sha }} by ${{ github.actor }}"
          echo "=========================================================="

          # Execute centralized selective deploy script
          if [ -f "/opt/garuda-astra/scripts/deploy.sh" ]; then
            bash /opt/garuda-astra/scripts/deploy.sh "$TARGET_BRANCH"
          else
            echo "Error: /opt/garuda-astra/scripts/deploy.sh not found on runner host!"
            exit 1
          fi
