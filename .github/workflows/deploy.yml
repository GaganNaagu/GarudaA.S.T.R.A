name: Continuous Automated Deployment

on:
  push:
    branches:
      - phase-2
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy onto Linux server'
        required: true
        default: 'phase-2'
        type: choice
        options:
          - phase-2
          - main
      force_build_apk:
        description: 'Force rebuild Android APK'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Modified Services
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check mobile app changes
        id: filter
        run: |
          if [ "${{ github.event.inputs.force_build_apk }}" = "true" ]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          if echo "$CHANGED" | grep "^apps/mobile-app/" | grep -qv "^apps/mobile-app/dist/"; then
            echo "Mobile source files changed -> triggering APK cloud build."
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "No mobile source changes -> skipping APK build."
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  build-apk:
    name: Build Release Android APK (Cloud)
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Mobile App Dependencies
        working-directory: apps/mobile-app
        run: npm install --prefer-offline --no-audit

      - name: Generate Native Android Project (Expo Prebuild)
        working-directory: apps/mobile-app
        run: |
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --non-interactive
          fi

      - name: Build Android Release APK
        working-directory: apps/mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: garudaastra-apk
          path: apps/mobile-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  deploy:
    name: Deploy to GCP Linux Server
    needs: [detect-changes, build-apk]
    if: always() && (needs.build-apk.result == 'success' || needs.build-apk.result == 'skipped')
    runs-on: self-hosted
    steps:
      - name: Selective Zero-Downtime Deployment
        shell: bash
        run: |
          TARGET_BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          echo "=========================================================="
          echo "Triggering deployment for branch: $TARGET_BRANCH"
          echo "Commit: ${{ github.sha }} by ${{ github.actor }}"
          echo "=========================================================="

          if [ -f "/opt/garuda-astra/scripts/deploy.sh" ]; then
            bash /opt/garuda-astra/scripts/deploy.sh "$TARGET_BRANCH"
          else
            echo "Error: /opt/garuda-astra/scripts/deploy.sh not found on runner host!"
            exit 1
          fi

      - name: Publish Newly Built APK to app.garudaastra.dpdns.org
        if: needs.build-apk.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: garudaastra-apk
          path: /tmp/garudaastra-apk

      - name: Install APK into Nginx Distribution Folder
        if: needs.build-apk.result == 'success'
        shell: bash
        run: |
          mkdir -p /opt/garuda-astra/apps/mobile-app/dist
          cp -f /tmp/garudaastra-apk/app-release.apk /opt/garuda-astra/apps/mobile-app/dist/garudaastra-release.apk
          rm -rf /tmp/garudaastra-apk
          echo "✔ Updated /opt/garuda-astra/apps/mobile-app/dist/garudaastra-release.apk for direct download!"
